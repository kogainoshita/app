<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 週間天気予報 - 1月20日起点シミュレーター</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
        
        :root {
            color-scheme: dark;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }

        .forecast-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* Loading animation */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 md:p-10 flex flex-col items-center">
    <div class="w-full max-w-4xl">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
                AI 週間天気予報
            </h1>
            <p class="text-slate-400">2026年1月20日(火)を起点とした気象シミュレーション</p>
        </header>

        <!-- Search Input Area -->
        <section class="glass-panel p-4 mb-8 flex flex-col md:flex-row gap-3">
            <div class="relative flex-1">
                <i class="fas fa-location-dot absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="cityInput" placeholder="都市名を入力 (例: 東京, 大阪, 札幌)" 
                    class="w-full bg-slate-800/50 border-none rounded-xl pl-12 pr-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
            <button onclick="fetchWeather()" id="searchBtn" 
                class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-8 py-3 rounded-xl transition-all flex items-center justify-center gap-2 min-w-[160px]">
                <span id="btnText">予報を取得</span>
                <div id="btnLoader" class="spinner hidden"></div>
            </button>
        </section>

        <!-- Error Display Area -->
        <div id="errorArea" class="hidden glass-panel p-6 bg-red-500/10 border-red-500/20 text-center mb-8">
            <p class="text-red-400 flex items-center justify-center gap-2">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMsg"></span>
            </p>
        </div>

        <!-- Weather Display Results -->
        <main id="weatherResult" class="hidden space-y-8">
            <!-- Main Current Weather Card -->
            <article class="glass-panel p-8 text-center md:text-left flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="flex-1">
                    <div class="flex items-center justify-center md:justify-start gap-3 mb-3 text-blue-400">
                        <i class="fas fa-calendar-check"></i>
                        <span id="resDate" class="font-bold tracking-wide">1月20日(火)</span>
                    </div>
                    <h2 class="text-4xl font-bold mb-2 flex items-center justify-center md:justify-start gap-2">
                        <span id="resCity">--</span>
                    </h2>
                    <div class="flex items-center justify-center md:justify-start gap-4 my-4">
                        <span id="resTemp" class="text-7xl font-bold tracking-tighter">--°</span>
                        <div class="text-left">
                            <p id="resCondition" class="text-2xl font-medium">--</p>
                            <p class="text-slate-400 text-sm">シミュレーション結果</p>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <i id="resIcon" class="fas fa-snowflake text-8xl text-blue-400 drop-shadow-[0_0_15px_rgba(56,189,248,0.3)] mt-4 md:mt-0"></i>
                </div>
            </article>

            <!-- 5-Day Forecast Grid -->
            <section>
                <h3 class="font-bold mb-4 ml-2 flex items-center gap-2 text-slate-200">
                    <i class="fas fa-calendar-week text-blue-400"></i>
                    1月20日からの5日間予報
                </h3>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4" id="weeklyGrid">
                    <!-- Cards will be injected here -->
                </div>
            </section>

            <!-- AI Insight/Advice -->
            <section class="glass-panel p-6 border-l-4 border-blue-500">
                <h3 class="font-bold mb-3 text-blue-400 flex items-center gap-2">
                    <i class="fas fa-robot"></i>
                    AI気象アドバイス
                </h3>
                <p id="resAdvice" class="text-slate-300 leading-relaxed italic"></p>
            </section>
        </main>

        <!-- Footer / Credits -->
        <footer class="mt-16 text-center text-slate-500 text-sm">
            <p>© 2026 AI Weather Simulator - Powered by Gemini API</p>
        </footer>
    </div>

    <script>
        /**
         * GitHub公開用設定
         * この環境ではAPIキーは実行時にシステムから注入されます。
         */
        const apiKey = ""; 

        async function fetchWeather() {
            const cityInput = document.getElementById('cityInput');
            const city = cityInput.value.trim();
            if (!city) return;

            // UI Elements
            const result = document.getElementById('weatherResult');
            const errorArea = document.getElementById('errorArea');
            const searchBtn = document.getElementById('searchBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            // State Reset
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            searchBtn.disabled = true;
            errorArea.classList.add('hidden');

            // 1月20日を起点とするプロンプト定義
            const systemPrompt = `あなたは高度な気象予報士AIです。
            2026年1月20日(火)を「今日」と仮定し、ユーザーが指定した都市のその日および翌日から5日間の天気予報をシミュレーションしてください。
            回答は必ず以下のJSON形式のみで出力してください。
            { 
                "date": "1月20日(火)", 
                "city": "入力された都市名", 
                "temp": 基準日の気温数値, 
                "condition": "晴れ/曇り/雪など", 
                "icon": "fa-sun, fa-cloud, fa-snowflake, fa-cloud-showers-heavy のいずれか", 
                "forecast": [ 
                    {"date": "1/21(水)", "max": 数値, "min": 数値, "condition": "天気", "icon": "fa-class"},
                    {"date": "1/22(木)", "max": 数値, "min": 数値, "condition": "天気", "icon": "fa-class"},
                    {"date": "1/23(金)", "max": 数値, "min": 数値, "condition": "天気", "icon": "fa-class"},
                    {"date": "1/24(土)", "max": 数値, "min": 数値, "condition": "天気", "icon": "fa-class"},
                    {"date": "1/25(日)", "max": 数値, "min": 数値, "condition": "天気", "icon": "fa-class"}
                ], 
                "advice": "この時期の服装や注意点に関する短いメッセージ" 
            }`;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `${city}の2026年1月20日からの天気予報を教えてください。` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { 
                            responseMimeType: "application/json",
                            temperature: 0.7
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error('APIへのアクセスに失敗しました。時間をおいて再度お試しください。');
                }

                const data = await response.json();
                const jsonText = data.candidates[0].content.parts[0].text;
                const weatherData = JSON.parse(jsonText);

                renderWeather(weatherData);
                result.classList.remove('hidden');
                
            } catch (err) {
                console.error("Error fetching weather:", err);
                document.getElementById('errorMsg').innerText = err.message;
                errorArea.classList.remove('hidden');
            } finally {
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
                searchBtn.disabled = false;
            }
        }

        function renderWeather(data) {
            // Update Main Card
            document.getElementById('resDate').innerText = data.date;
            document.getElementById('resCity').innerText = data.city;
            document.getElementById('resTemp').innerText = `${data.temp}°`;
            document.getElementById('resCondition').innerText = data.condition;
            document.getElementById('resIcon').className = `fas ${data.icon} text-8xl text-blue-400 drop-shadow-[0_0_15px_rgba(56,189,248,0.3)] mt-4 md:mt-0`;
            document.getElementById('resAdvice').innerText = data.advice;

            // Update Forecast Grid
            const grid = document.getElementById('weeklyGrid');
            grid.innerHTML = ''; // Clear current contents

            data.forecast.forEach(f => {
                const card = document.createElement('div');
                card.className = 'glass-panel p-4 text-center forecast-card flex flex-col items-center justify-center';
                card.innerHTML = `
                    <p class="text-xs text-blue-300 font-bold mb-2">${f.date}</p>
                    <i class="fas ${f.icon} text-2xl mb-3 text-slate-300"></i>
                    <div class="flex flex-col">
                        <span class="font-bold text-lg">${f.max}°</span>
                        <span class="text-xs text-slate-400">${f.min}°</span>
                    </div>
                    <p class="text-[10px] mt-2 text-slate-500 font-medium">${f.condition}</p>
                `;
                grid.appendChild(card);
            });
        }

        // Allow 'Enter' key to trigger search
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchWeather();
        });
    </script>
</body>
</html>
